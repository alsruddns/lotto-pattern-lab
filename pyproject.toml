[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lotto-pattern-lab"
version = "0.1.0"
description = "Tools for exploring patterns in Korean Lotto 6/45 draws."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["deap>=1.4.1", "numpy>=1.26", "plotly>=5.18", "streamlit>=1.40"]

[project.optional-dependencies]
symbolic = ["pysr>=2.7.0,<3"]
optimization = ["optuna>=4.2,<5"]
classical = ["scikit-learn>=1.4"]
boosting = ["scikit-learn>=1.4", "xgboost>=2.1"]
neural = ["torch>=2.5"]

[project.scripts]
lotto-pattern-lab = "lotto_pattern_lab.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
